name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinicflow
          POSTGRES_USER: clinicflow
          POSTGRES_PASSWORD: clinicflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicflow -d clinicflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://clinicflow:clinicflow_ci@localhost:5432/clinicflow
      JWT_SECRET: clinicflow-ci-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 2h
      FRONTEND_ORIGIN: http://localhost:5173
      VITE_API_URL: http://localhost:4000/api
      PORT: 4000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose config --quiet

